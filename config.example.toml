[backup]
compress = true
# dump_method = "go" | "binary"
dump_method = "go"

[database.mysql]
host = "127.0.0.1"
port = 3306
user = "root"
password = "secret"
databases = ["mydb"]

[storage]
# backend = "r2" | "s3"
backend = "r2"

[storage.r2]
account_id = "your-account-id"
access_key_id = "your-access-key-id"
access_key_secret = "your-access-key-secret"
bucket = "db-backups"
path_prefix = "mysql/"

# [storage.s3]
# region = "ap-southeast-1"
# access_key_id = "AKIA..."
# secret_access_key = "xxx"
# bucket = "db-backups"
# path_prefix = "mysql/"
# endpoint = ""

[retention]
# strategy = "count" | "days"
strategy = "count"
count = 7
# days = 30

[notification.telegram]
enabled = false
bot_token = "your-bot-token"
chat_id = "your-chat-id"

[notification.slack]
enabled = false
webhook_url = "https://hooks.slack.com/services/T.../B.../xxx"

[notification.webhook]
enabled = false
url = "https://your-server.com/webhook/backup"
